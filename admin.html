<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falak Agent Admin</title><style>
:root{--bg:#060b12;--panel:rgba(18,29,43,.78);--line:rgba(120,165,205,.18);--text:#f3f7fb;--muted:#91a4b9;--blue:#33b9ff;--gold:#f4c15e;--green:#36d58a;--red:#ff6374}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,rgba(35,117,165,.22),transparent 34%),radial-gradient(circle at 90% 10%,rgba(94,67,160,.16),transparent 28%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:245px;padding:22px 14px;background:#080e17;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}.brand{font-size:19px;font-weight:900;padding:8px 10px 24px}.brand span{color:var(--blue)}nav button{width:100%;border:0;background:none;color:#b8c6d8;text-align:left;padding:12px 13px;border-radius:12px;margin:2px 0;cursor:pointer}nav button:hover,nav button.active{background:#14263a;color:#fff}.main{flex:1;padding:25px;max-width:1450px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(21,36,53,.82),rgba(9,17,27,.9));backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.n{font-size:28px;font-weight:900;margin-top:8px}.section{margin-top:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:7px;flex:1;min-width:180px;margin:8px 0}.field label{font-size:12px;color:var(--muted)}input,textarea,select{background:#07101a;color:white;border:1px solid #2a3c54;border-radius:11px;padding:11px;outline:0}textarea{min-height:110px}.btn{border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 14px;background:rgba(30,55,79,.72);color:white;font-weight:800;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.15)}.primary{background:linear-gradient(135deg,#168fe3,#32baff)}.danger{background:#4c1d28}.success{background:#17472f}.gold{background:#4d3819}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:12px;color:var(--muted)}.badge{padding:5px 9px;border-radius:99px;background:#17334c;color:#9ddcff;font-size:11px}.hidden{display:none}.login{max-width:420px;margin:12vh auto}.toast{position:fixed;right:20px;bottom:20px;background:#152437;border:1px solid var(--line);padding:13px 16px;border-radius:12px}.err{color:var(--red)}@media(max-width:850px){.side{width:72px;padding:15px 7px}.brand{font-size:0}.brand:after{content:'FA';font-size:19px}.side nav button{font-size:0;text-align:center}.side nav button:first-letter{font-size:18px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.side{display:none}.main{padding:14px}.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login card"><h1>👑 Falak Agent</h1><p class="muted">Secure Admin Console</p><div class="field"><label>Username</label><input id="lu"></div><div class="field"><label>Password</label><input id="lp" type="password"></div><button class="btn primary" onclick="login()">Sign in</button><p id="lm" class="err"></p></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">👑 FALAK <span>AGENT</span></div><nav><button class="active" onclick="show('dashboard',this)">📊 Dashboard</button><button onclick="show('start',this)">🖼 Start Page</button><button onclick="show('channels',this)">📺 Channels</button><button onclick="show('tasks',this)">🎁 Tasks</button><button onclick="show('broadcast',this)">📢 Broadcast</button><button onclick="show('withdrawals',this)">💸 Withdrawals</button><button onclick="show('gifts',this)">🎟 Gift Codes</button><button onclick="show('settings',this)">⚙ Settings</button><button onclick="logout()">↪ Logout</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Falak Agent Reward System</div></div><span class="badge">● LIVE</span></div><div id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function api(u,o={}){const r=await fetch(u,{credentials:'include',headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
async function login(){try{await api('/admin/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}catch(e){$('lm').textContent=e.message}}
async function logout(){await api('/admin/logout',{method:'POST'});location.reload()}
const pages={dashboard,start,channels,tasks,broadcast,withdrawals,gifts,settings};
function show(n,el){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');$('title').textContent=n.replace(/^./,c=>c.toUpperCase());pages[n]()}
async function dashboard(){const d=await api('/admin/api/stats');$('content').innerHTML=`<div class="grid">${[['👥 Users',d.users],['🎁 Tasks',d.tasks],['📺 Channels',d.channels],['💸 Pending Withdrawals',d.pending]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="n">${x[1]}</div></div>`).join('')}</div><div class="section card"><h3>Quick Actions</h3><div class="row"><button class="btn primary" onclick="show('broadcast')">📢 Broadcast</button><button class="btn" onclick="show('channels')">📺 Channels</button><button class="btn gold" onclick="show('withdrawals')">💸 Withdrawals</button></div></div>`}
async function start(){const d=await api('/admin/api/settings');$('content').innerHTML=`<div class="card"><h3>🖼 Start Page</h3><p class="muted">Set the welcome poster, title and compact message shown to new users. Telegram renders the final message using its own client fonts and bubble styling.</p><div class="field"><label>Photo file_id</label><input id="si" value="${esc(d.start_image_file_id)}"></div><div class="field"><label>Title</label><input id="st" value="${esc(d.start_title)}"></div><div class="field"><label>Welcome text</label><textarea id="sx">${esc(d.start_text)}</textarea></div><button class="btn primary" onclick="saveStart()">💾 Save</button></div>`}
async function saveStart(){await api('/admin/api/settings',{method:'POST',body:JSON.stringify({start_image_file_id:$('si').value,start_title:$('st').value,start_text:$('sx').value})});toast('Start page saved')}
async function channels(){const r=await api('/admin/api/channels');const s=await api('/admin/api/settings');$('content').innerHTML=`<div class="card"><h3>📺 Channel Manager</h3><div class="badge">Flexible • Public/Private • Required/Optional</div><div class="row"><div class="field"><label>Channel name</label><input id="ct" placeholder="Main Rewards Channel"></div><div class="field"><label>Visibility</label><select id="ctype" onchange="channelTypeChanged()"><option value="public">🌐 Public</option><option value="private">🔒 Private</option></select></div><div class="field"><label>Access rule</label><select id="cv"><option value="required">🔒 Required — blocks bot access</option><option value="optional">📢 Optional — never blocks access</option></select></div></div><div class="row"><div class="field"><label>Chat ID</label><input id="cc" placeholder="Public: @channelusername · Private: -1001234567890"></div><div class="field"><label>Public Username</label><input id="cu" placeholder="@channelusername (public only)"></div><div class="field"><label>Join / Invite URL</label><input id="ci" placeholder="https://t.me/channel or https://t.me/+PRIVATE_INVITE"></div></div><div class="row"><div class="field"><label>Status</label><select id="ca"><option value="active">🟢 Active</option><option value="inactive">⚪ Inactive</option></select></div></div><p class="muted"><b>Private:</b> use the numeric <code>-100...</code> Chat ID and a private invite link. <b>Optional:</b> the channel is shown to users but never blocks access. The bot should be an administrator for membership verification. After adding, use <b>Test</b> to confirm Telegram access.</p><button class="btn primary" onclick="addChannel()">＋ Add Channel</button></div><div class="section card"><h3>🧩 Channel button layout</h3><p class="muted">You decide how many channel buttons appear in each row in Telegram.</p><div class="row"><div class="field"><label>Buttons per row</label><select id="cl"><option value="1" ${String(s.channel_layout)==='1'?'selected':''}>1 — one full-width channel per row</option><option value="2" ${String(s.channel_layout)==='2'?'selected':''}>2 — two channels per row</option><option value="3" ${String(s.channel_layout||'3')==='3'?'selected':''}>3 — three compact channels per row</option></select></div></div><button class="btn primary" onclick="saveChannelLayout()">💾 Save layout</button></div><div class="section card tablewrap"><table class="table"><thead><tr><th>Channel</th><th>Visibility</th><th>Chat ID</th><th>Access</th><th>Status</th><th>Actions</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.title)}</td><td>${x.channel_type==='private'?'🔒 Private':'🌐 Public'}</td><td>${esc(x.chat_id)}</td><td>${x.verification_required?'🔒 Required':'📢 Optional'}</td><td>${x.active?'🟢':'⚪'}</td><td><button class="btn" onclick='editChannel(${x.id},${JSON.stringify(x)})'>✏️ Edit</button> <button class="btn" onclick="testChannel(${x.id})">🧪 Test</button> <button class="btn danger" onclick="delChannel(${x.id})">🗑 Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function channelTypeChanged(){const privateMode=$('ctype').value==='private';$('cu').disabled=privateMode;$('cu').value=privateMode?'':'';$('cc').placeholder=privateMode?'Private Chat ID: -1001234567890':'Public Chat ID: @channelusername';$('ci').placeholder=privateMode?'Private invite: https://t.me/+PRIVATE_INVITE':'Public URL: https://t.me/channel';}
async function addChannel(){try{await api('/admin/api/channels',{method:'POST',body:JSON.stringify({title:$('ct').value,channel_type:$('ctype').value,chat_id:$('cc').value,username:$('cu').value,invite_url:$('ci').value,verification_required:$('cv').value==='required',active:$('ca').value==='active'})});toast('Channel added');channels()}catch(e){toast(e.message||'Failed to add channel')}}
async function saveChannelLayout(){await api('/admin/api/settings',{method:'POST',body:JSON.stringify({channel_layout:$('cl').value})});toast('Channel layout saved')}
async function testChannel(id){try{const d=await api('/admin/api/channels/'+id+'/test',{method:'POST'});toast(`✓ ${d.title} • bot: ${d.bot_status}${d.is_admin?' • admin':''}`)}catch(e){toast('✕ '+e.message)}}
async function editChannel(id,x){const title=prompt('Title',x.title);if(title===null)return;const channel_type=(prompt('Type: public or private',x.channel_type||'public')||'public').toLowerCase()==='private'?'private':'public';const chat_id=prompt('Chat ID (private: -100..., public: @username)',x.chat_id);if(chat_id===null)return;const username=prompt('Public username (leave blank for private)',x.username||'');if(username===null)return;const invite=prompt('Join / Invite URL',x.invite_url||'');if(invite===null)return;const req=confirm('Membership required? OK = Required, Cancel = Optional');const active=confirm('Channel active? OK = Active, Cancel = Inactive');try{await api('/admin/api/channels/'+id,{method:'PUT',body:JSON.stringify({title,channel_type,chat_id,username,invite_url:invite,verification_required:req,active})});toast('Channel updated');channels()}catch(e){toast(e.message||'Failed to update channel')}}
async function delChannel(id){if(!confirm('Delete this channel?'))return;await api('/admin/api/channels/'+id,{method:'DELETE'});toast('Channel deleted');channels()}
async function tasks(){const r=await api('/admin/api/tasks');$('content').innerHTML=`<div class="card"><h3>🎁 Create Task</h3><div class="row"><div class="field"><label>Title</label><input id="tt"></div><div class="field"><label>Reward</label><input id="tr" type="number" step="0.01"></div><div class="field"><label>Daily limit</label><input id="tl" type="number" value="1"></div></div><div class="field"><label>Description</label><textarea id="td"></textarea></div><button class="btn primary" onclick="addTask()">＋ Create</button></div><div class="section card tablewrap"><table class="table"><thead><tr><th>Task</th><th>Reward</th><th>Limit</th><th>Status</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.reward)}</td><td>${x.daily_limit}</td><td>${x.active?'🟢':'⚪'}</td></tr>`).join('')}</tbody></table></div>`}
async function addTask(){await api('/admin/api/tasks',{method:'POST',body:JSON.stringify({title:$('tt').value,description:$('td').value,reward:$('tr').value,daily_limit:$('tl').value})});toast('Task created');tasks()}
async function broadcast(){$('content').innerHTML=`<div class="card"><h3>📢 Broadcast Center</h3><div class="field"><label>Type</label><select id="bk"><option value="text">💬 Text</option><option value="photo">🖼 Photo</option><option value="video">🎬 Video</option></select></div><div class="field"><label>Message / Caption</label><textarea id="bt"></textarea></div><div class="field"><label>Media file_id (photo/video)</label><input id="bm"></div><div class="field"><label>Audience</label><select id="ba"><option value="all">All active users</option><option value="verified">Verified/active users</option><option value="balance">Users with balance</option></select></div><button class="btn primary" onclick="sendBroadcast()">🚀 Send Broadcast</button></div>`}
async function sendBroadcast(){const d=await api('/admin/api/broadcast',{method:'POST',body:JSON.stringify({kind:$('bk').value,text:$('bt').value,media_file_id:$('bm').value,audience:$('ba').value})});toast(`Finished: ${d.sent} sent / ${d.failed} failed`)}
async function withdrawals(){const r=await api('/admin/api/withdrawals');$('content').innerHTML=`<div class="card tablewrap"><h3>💸 Withdrawal Queue</h3><table class="table"><thead><tr><th>ID</th><th>User</th><th>Amount</th><th>Method</th><th>Destination</th><th>Status</th><th>Action</th></tr></thead><tbody>${r.map(x=>`<tr><td>WD-${x.id}</td><td>${esc(x.username||x.telegram_id)}</td><td>₹${Number(x.amount).toFixed(2)}</td><td>${esc(x.method)}</td><td>${esc(x.destination)}</td><td>${esc(x.status)}</td><td>${x.status==='pending'?`<button class="btn success" onclick="pay(${x.id})">✅ Pay</button> <button class="btn danger" onclick="rejectW(${x.id})">❌ Reject</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`}
async function pay(id){if(!confirm('Confirm payment has actually been sent?'))return;await api('/admin/api/withdrawals/'+id+'/pay',{method:'POST'});toast('Marked paid');withdrawals()}
async function rejectW(id){const note=prompt('Reason','Rejected by admin')||'Rejected';await api('/admin/api/withdrawals/'+id+'/reject',{method:'POST',body:JSON.stringify({note})});toast('Rejected and refunded');withdrawals()}
async function gifts(){const r=await api('/admin/api/gifts');$('content').innerHTML=`<div class="card"><h3>🎟 Gift Codes</h3><div class="row"><div class="field"><label>Code</label><input id="gc"></div><div class="field"><label>Amount</label><input id="ga" type="number"></div><div class="field"><label>Max uses</label><input id="gu" type="number" value="1"></div></div><button class="btn gold" onclick="addGift()">＋ Create Code</button></div><div class="section card tablewrap"><table class="table"><thead><tr><th>Code</th><th>Amount</th><th>Uses</th><th>Status</th></tr></thead><tbody>${r.map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>₹${Number(x.amount).toFixed(2)}</td><td>${x.used_count}/${x.max_uses}</td><td>${x.active?'🟢':'⚪'}</td></tr>`).join('')}</tbody></table></div>`}
async function addGift(){await api('/admin/api/gifts',{method:'POST',body:JSON.stringify({code:$('gc').value,amount:$('ga').value,max_uses:$('gu').value})});toast('Gift code created');gifts()}
async function settings(){const d=await api('/admin/api/settings');$('content').innerHTML=`<div class="card"><h3>⚙ Global Settings</h3><div class="row"><div class="field"><label>Currency</label><input id="cur" value="${esc(d.currency)}"></div><div class="field"><label>Minimum withdrawal</label><input id="mw" value="${esc(d.min_withdrawal)}"></div><div class="field"><label>Referral reward</label><input id="rr" value="${esc(d.referral_reward)}"></div></div><div class="row"><div class="field"><label>Updates URL</label><input id="uu" value="${esc(d.updates_url)}"></div><div class="field"><label>Privacy Policy URL</label><input id="pu" value="${esc(d.privacy_url)}"></div><div class="field"><label>Auto-open home after verification</label><select id="as"><option value="1" ${String(d.auto_start_after_verify||"1")==="1"?"selected":""}>✅ Enabled</option><option value="0" ${String(d.auto_start_after_verify||"1")==="0"?"selected":""}>⛔ Disabled</option></select></div></div><button class="btn primary" onclick="saveSettings()">💾 Save</button></div>`}
async function saveSettings(){await api('/admin/api/settings',{method:'POST',body:JSON.stringify({currency:$('cur').value,min_withdrawal:$('mw').value,referral_reward:$('rr').value,updates_url:$('uu')?.value||'',privacy_url:$('pu')?.value||'',auto_start_after_verify:$('as')?.value||'1'})});toast('Settings saved')}
api('/admin/api/session').then(()=>{$('login').classList.add('hidden');$('app').classList.remove('hidden');show('dashboard')}).catch(()=>{});
</script></body></html>
